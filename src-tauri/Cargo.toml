[package]
name = "iot-sign-language-desktop"
version = "1.0.0"
description = "IoT Sign Language Desktop Application with TTS"
authors = ["Yigitalp02"]
license = "MIT"
repository = "https://github.com/Yigitalp02/IOT-Sign-Language-Gloves-Desktop-App"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "devtools", "updater"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.2"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "namedpipeapi", "fileapi", "handleapi",
    "winbase", "winerror", "minwindef",
] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

