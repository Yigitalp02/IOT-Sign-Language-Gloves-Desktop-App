name: Release

# Trigger: push a version tag like v1.0.1, v1.2.0, etc.
# How to release:
#   1. Bump version in: package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json
#   2. git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish (Windows)
    runs-on: windows-latest

    steps:
      # ── Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Node / pnpm ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Python (model server) ─────────────────────────────────────────────
      # The build script is non-fatal: if the venv / ML deps are unavailable
      # it silently skips, and the app still works via the cloud API.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build model server (if requirements exist)
        shell: pwsh
        run: |
          $req = "iot-sign-glove\requirements.txt"
          if (Test-Path $req) {
            python -m venv iot-sign-glove\.venv
            iot-sign-glove\.venv\Scripts\python.exe -m pip install -r $req pyinstaller --quiet
            python iot-sign-glove\build_model_server.py
          } else {
            Write-Host "No requirements.txt found — skipping model server build."
          }

      # ── Resource placeholders ─────────────────────────────────────────────
      # webgl-build/ is tracked in git so it's always present.
      # The model-server exe is built locally and gitignored; create a placeholder
      # so Tauri's bundler doesn't error on the glob. The app falls back to the
      # cloud API when no local model server is bundled.
      - name: Create model-server placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\resources\model-server"
          New-Item -ItemType File      -Force -Path "src-tauri\resources\model-server\.keep" | Out-Null

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Tauri build + publish release ─────────────────────────────────────
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add TAURI_PRIVATE_KEY (contents of the .key file) to
          # Settings → Secrets and variables → Actions in your GitHub repo.
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'IoT Sign Language v__VERSION__'
          releaseBody: |
            ## IoT Sign Language v__VERSION__

            ### Installation
            Download the `.exe` installer below and run it.
            The app will auto-update itself for future releases.

            ### Requirements
            - Windows 10 / 11
            - IoT ASL sensor glove hardware
          releaseDraft: false
          prerelease: false
          # Build both MSI and NSIS:
          #   • MSI  → used by the auto-updater (latest.json points here by default)
          #   • NSIS → listed in the release as an alternative .exe download
          args: --bundles msi,nsis
